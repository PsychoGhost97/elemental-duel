<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14181d">
<meta name="description" content="Elemental Duel — a local two-player monster battle game.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>Elemental Duel</title>
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#14181d;--mute:#5d6672;--line:#cfd6de;--A:#1f5fbf;--B:#b8431f;--btn:#14181d;--btnink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181d;--card:#202630;--ink:#eef1f4;--mute:#9aa5b3;--line:#364050;--A:#7db0ff;--B:#ff9a76;--btn:#eef1f4;--btnink:#14181d}}
:root[data-theme="dark"]{--bg:#14181d;--card:#202630;--ink:#eef1f4;--mute:#9aa5b3;--line:#364050;--A:#7db0ff;--B:#ff9a76;--btn:#eef1f4;--btnink:#14181d}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:480px;margin:0 auto;padding:16px}
h1,h2{font-family:Georgia,"Times New Roman",serif;margin:.2em 0}
h1{font-size:2rem}h2{font-size:1.4rem}
.mute{color:var(--mute)}.center{text-align:center;padding-top:12vh}
.pA{color:var(--A)}.pB{color:var(--B)}
.card{background:var(--card);border:1px solid var(--line);border-left:8px solid var(--c);border-radius:10px;padding:0;margin:10px 0;display:flex;overflow:hidden}
.card .art{width:42%;flex:none;display:block}.card .info{flex:1;padding:10px;min-width:0}
img.art{align-self:flex-start;height:auto;aspect-ratio:10/7;object-fit:cover}
.card.big{flex-direction:column}.card.big .art{width:100%}
.stat{display:inline-block;font-weight:700;font-size:1.1rem;margin-right:12px}
.adv{display:inline-block;margin-top:6px;padding:2px 10px;border-radius:999px;background:var(--c);color:#111;font-size:.85rem;font-weight:600}
.row{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.bar{height:8px;background:var(--line);border-radius:4px;margin:8px 0 2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c)}
.opt{cursor:pointer}.opt.on{outline:3px solid var(--ink)}
button{font:inherit;font-weight:600;width:100%;min-height:52px;margin-top:12px;border:0;border-radius:10px;background:var(--btn);color:var(--btnink)}
button:disabled{opacity:.35}
button:focus-visible,.opt:focus-visible{outline:3px solid var(--A);outline-offset:2px}
.note{margin:6px 0 0;font-size:.95rem}
.legend{font-size:.9rem;color:var(--mute);text-align:center;margin-top:20px}
.banner{font-family:Georgia,serif;font-size:1.6rem;text-align:center;margin:12px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.tile{flex-direction:column;margin:0;position:relative;cursor:pointer}
.tile .art{width:100%}.tile .info{padding:8px}
.tile.sel{outline:4px solid var(--ink)}.tile.dim{opacity:.45}
.badge{position:absolute;top:6px;left:6px;background:var(--ink);color:var(--bg);font-weight:700;font-size:.8rem;padding:2px 8px;border-radius:999px}
.sticky{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding:6px 0}
.sticky.bot{top:auto;bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.strip{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:6px}
.slot{position:relative;border-radius:6px;overflow:hidden;border:2px solid var(--c,var(--line));background:var(--card);cursor:pointer;font-size:.62rem;text-align:center}
.slot .art{width:100%;height:auto;display:block}
.slot small{display:block;padding:1px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot.empty{border:2px dashed var(--line);aspect-ratio:10/8;display:flex;align-items:center;justify-content:center;color:var(--mute);cursor:default;font-size:.9rem}
.slot .x{position:absolute;top:0;right:0;background:var(--ink);color:var(--bg);width:16px;height:16px;line-height:16px;font-size:12px}
ul{padding-left:20px}
</style>
</head>
<body>

const vec=m=>`<svg class="art" viewBox="0 0 100 70" role="img" aria-label="${m.name}, ${EL[m.el].n} monster">${BG[m.el]}<g stroke="#161616" stroke-width="1.2" stroke-linejoin="round">${MON[m.name]}</g></svg>`;
window.fallback=(img)=>{const t=document.createElement("template");t.innerHTML=vec({name:img.dataset.n,el:img.dataset.e});img.replaceWith(t.content.firstChild)};
const art=m=>IMG[m.name]?`<img class="art" data-n="${m.name}" data-e="${m.el}" onerror="fallback(this)" src="${IMG[m.name]}" alt="${m.name}, ${EL[m.el].n} monster" width="500" height="350">`:`<svg class="art" viewBox="0 0 100 70" role="img" aria-label="${m.name}, ${EL[m.el].n} monster">${BG[m.el]}<g stroke="#161616" stroke-width="1.2" stroke-linejoin="round">${MON[m.name]}</g></svg>`;
const ADV=`<span class="adv">Advantage +${BONUS}</span>`;
function card(m,p,note="",extra="",big=false){
  const e=EL[m.el];
  return `<div class="card${big?" big":""}" style="--c:${e.c}" ${extra}>${art(m)}<div class="info"><div class="row"><b>${m.name}</b><span class="p${p}">Player ${p}</span></div>
  <div class="mute">${e.i} ${e.n}</div><div><span class="stat">⚔ ${m.power}</span><span class="stat">♥ ${Math.max(0,m.hp)}/${m.max}</span></div>
  <div class="bar" style="--c:${e.c}"><i style="width:${Math.max(0,m.hp/m.max*100)}%"></i></div>${note}</div></div>`;
}
const score=()=>`<p class="mute">Monsters left: <b class="pA">Player A ${alive("A").length}</b> · <b class="pB">Player B ${alive("B").length}</b></p>`;
const legend=`<p class="legend">🔥 beats 🌿 beats 🏜️ beats 🌊 beats ⛰️ beats 🔥<br>Advantage adds +${BONUS} damage.</p>`;

function intro(){
  show(`<div class="center"><h1>Elemental Duel</h1>
  <p class="mute">Two players, one phone.</p>
  <ul style="text-align:left"><li>Each player builds a secret team of five from the ten monsters. Any mix is allowed.</li>
  <li>Both players secretly pick a monster. Both attack at the same time.</li>
  <li>Damage is Power, plus ${BONUS} if your element beats theirs.</li>
  <li>Health carries over. A defeated monster is gone for good.</li>
  <li>Defeat all five enemy monsters to win.</li></ul>
  <button onclick="newGame()">Start match</button>${legend}</div>`);
}
const ALL=[];for(let i=0;i<5;i++)ALL.push(ROSTER.A[i],ROSTER.B[i]);
const mon=k=>{const [name,el,power,max]=ALL[k];return{name,el,power,max,hp:max}};
function newGame(){G={team:{},sel:{},act:{A:null,B:null},round:0,q:[],open:false};passTeam("A")}
function passTeam(p){
  show(`<div class="center"><h1 class="p${p}">Player ${p}</h1>
  <p>Hand the phone to Player ${p}.<br><span class="mute">Build a team of five. Your team stays secret.</span></p>
  <button onclick="teamPick('${p}')">I’m Player ${p}: build my team</button></div>`);
}
function teamPick(p){G.cur=p;G.tmp=[];teamScreen(true)}
const tile=(k,on,full)=>{const m=mon(k),e=EL[m.el];
  return `<div class="card tile${on?" sel":""}${full&&!on?" dim":""}" role="button" tabindex="0" aria-pressed="${on}" style="--c:${e.c}" onclick="toggle(${k})">${art(m)}<div class="info"><b>${m.name}</b><div class="mute">${e.i} ${e.n}</div><span class="stat">⚔ ${m.power}</span><span class="stat">♥ ${m.max}</span></div>${on?'<span class="badge">✓ Picked</span>':""}</div>`};
function teamScreen(top){
  const p=G.cur,n=G.tmp.length,full=n===5;
  const slots=[0,1,2,3,4].map(i=>{const k=G.tmp[i];if(k===undefined)return `<div class="slot empty">${i+1}</div>`;
    const m=mon(k);return `<div class="slot" role="button" tabindex="0" aria-label="Remove ${m.name}" onclick="toggle(${k})" style="--c:${EL[m.el].c}">${art(m)}<small>${m.name}</small><span class="x">×</span></div>`}).join("");
  const y=window.scrollY||0;
  $.innerHTML=`<div class="sticky"><h2 class="p${p}">Player ${p}: choose 5 monsters</h2>
  <div class="row"><b>${n}/5 selected</b><span class="mute">${full?"Full. Tap one to remove it.":"Tap a monster to add it."}</span></div><div class="strip">${slots}</div></div>
  <div class="grid">${ALL.map((_,k)=>tile(k,G.tmp.includes(k),full)).join("")}</div>
  <div class="sticky bot"><button ${full?"":"disabled"} onclick="confirmTeam()">${full?"Confirm team":"Pick "+(5-n)+" more"}</button></div>${legend}`;
  window.scrollTo(0,top?0:y);
}
function toggle(k){const i=G.tmp.indexOf(k);if(i>=0)G.tmp.splice(i,1);else if(G.tmp.length<5)G.tmp.push(k);teamScreen(false)}
function confirmTeam(){
  if(G.tmp.length!==5)return;
  G.sel[G.cur]=G.tmp.slice();
  if(G.cur==="A")passTeam("B");else startBattle();
}
function startBattle(){
  for(const p of "AB")G.team[p]=G.sel[p].map(mon);
  G.q=["A","B"];G.open=false;pass(0);
}
function pass(i){
  const p=G.q[i];
  show(`<div class="center"><h1 class="p${p}">Player ${p}</h1>
  <p>Hand the phone to Player ${p}.<br><span class="mute">${G.open?"You pick a replacement.":"Your pick stays secret."}</span></p>
  <button onclick="pick(${i})">I’m Player ${p}: show my monsters</button></div>`);
}
function pick(i){
  sel=null;const p=G.q[i],q=other(p);
  const opp=G.open?`<h2>Their active monster</h2>${card(act(q),q)}`:"";
  const opts=G.team[p].map((m,k)=>{
    if(m.hp<=0)return"";
    let note="";
    if(G.open){const o=act(q);
      note=`<p class="note">${hasAdv(m,o)?"✅ Advantage: +"+BONUS+" damage":hasAdv(o,m)?"⚠️ They have advantage":"Neutral matchup"}</p>`;}
    return card(m,p,note,`role="button" tabindex="0" id="o${k}" onclick="choose(${k})"`).replace('class="card"','class="card opt"');
  }).join("");
  show(`<h2 class="p${p}">Player ${p}: choose a monster</h2>${opp}<h2>Your monsters</h2>${opts}
  <button id="go" disabled onclick="confirmPick(${i})">Confirm pick</button>${legend}`);
}
function choose(k){
  sel=k;
  document.querySelectorAll(".opt").forEach(x=>x.classList.toggle("on",x.id==="o"+k));
  document.getElementById("go").disabled=false;
}
function confirmPick(i){
  const p=G.q[i];G.act[p]=sel;
  if(i+1<G.q.length)pass(i+1);else battle();
}
function battle(){
  G.round++;const a=act("A"),b=act("B");
  const line=(x,y)=>`${x.name} will deal <b>${dmg(x,y)}</b>${hasAdv(x,y)?` (${x.power}+${BONUS}, advantage)`:""}`;
  show(`<h2>Round ${G.round}</h2>${score()}${card(a,"A",hasAdv(a,b)?ADV:"","",true)}${card(b,"B",hasAdv(b,a)?ADV:"","",true)}
  <p class="note">${line(a,b)}.<br>${line(b,a)}.</p><button onclick="resolve()">Fight</button>${legend}`);
}
function resolve(){
  const a=act("A"),b=act("B"),da=dmg(a,b),db=dmg(b,a);
  b.hp-=da;a.hp-=db;
  const n=(m,d)=>`<p class="note">Took ${d} damage.${m.hp<=0?" <b>Defeated.</b>":""}</p>`;
  const aa=alive("A").length,bb=alive("B").length,over=!aa||!bb;
  let end="",btn=`<button onclick="next()">Continue</button>`;
  if(over){
    end=`<div class="banner">${!aa&&!bb?"Draw: both teams fell together.":!aa?"Player B wins!":"Player A wins!"}</div>`;
    btn=`<button onclick="intro()">Play again</button>`;
  }
  show(`<h2>Round ${G.round} result</h2>${end}${score()}${card(a,"A",n(a,db),"",true)}${card(b,"B",n(b,da),"",true)}${btn}`);
}
function next(){
  const a=act("A"),b=act("B");
  const list=a.hp<=0&&b.hp<=0?["A","B"]:a.hp<=0?["A"]:b.hp<=0?["B"]:[];
  if(!list.length)return battle();
  G.q=list;G.open=list.length===1;pass(0);
}
intro();
</script>
